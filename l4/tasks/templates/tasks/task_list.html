{% extends 'base.html' %} {% block title %}Tasks{% endblock %}

<!---->

{% block content%}
<div class="card">
  <h1>Tasks</h1>
  <p><a href="{% url 'tasks:task_create' %}">+ New Task</a></p>
  {% if tasks %}
  <ul>
    {% for task in tasks %}
    <li>
      <a href="{% url 'tasks:task_details' task.pk %}">{{task.title}}</a>
      <a href="{% url 'tasks:task_edit' task.pk %}">Edit Task</a>
      <a href="{% url 'tasks:task_delete' task.pk %}">Delete Task</a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No tasks yet!</p>
  {% endif %}
</div>
{% endblock %}
