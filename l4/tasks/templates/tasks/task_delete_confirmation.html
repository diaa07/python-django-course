{% extends "base.html" %}
{% block title %}Delete {{ task }}{% endblock %}
{% block content %}
  <div class="card">
    <h1>Delete {{ task }}?</h1>
    <p>This can't be undone!</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Yes, delete it</button>
      <a href="{% url 'tasks:task_details' task.pk %}">Cancel</a>
    </form>
  </div>
{% endblock %}
